name: Release CLI Alpha

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Pack npm tarball
        run: |
          mkdir -p release
          pnpm pack --pack-destination release

      - name: Verify package exists
        run: |
          package_path="$(find release -type f -name '*.tgz' -print -quit)"
          test -n "$package_path"
          echo "Built $package_path"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: valedictorian-cli-npm-package
          path: release/*.tgz
          if-no-files-found: error

      - name: Create GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.tgz \
              --title "Valedictorian CLI $GITHUB_REF_NAME" \
              --notes "Private alpha CLI package." \
              --prerelease
          fi
