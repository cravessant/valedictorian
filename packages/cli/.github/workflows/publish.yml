name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.5.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        working-directory: packages/cli
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const expectedTag = `v${packageJson.version}`
          const actualTag = process.env.GITHUB_REF_NAME

          if (actualTag !== expectedTag) {
            throw new Error(`Release tag ${actualTag} does not match package version ${expectedTag}`)
          }
          NODE

      - name: Lint
        run: pnpm --filter @sparxie/valedictorian-cli run lint

      - name: Test
        run: pnpm --filter @sparxie/valedictorian-cli run test

      - name: Build
        run: pnpm --filter @sparxie/valedictorian-cli run build

      - name: Verify package contents
        run: pnpm --dir packages/cli pack --dry-run

      - name: Resolve npm dist-tag
        id: npm-dist-tag
        working-directory: packages/cli
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const match = packageJson.version.match(/-(alpha|beta|rc)\./)
          const tag = match?.[1] ?? ''

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`)
          console.log(tag ? `Publishing with npm dist-tag: ${tag}` : 'Publishing with npm default latest dist-tag')
          NODE

      - name: Publish
        working-directory: packages/cli
        env:
          NPM_DIST_TAG: ${{ steps.npm-dist-tag.outputs.tag }}
        run: |
          publish_args=(publish --access public)

          if [ -n "$NPM_DIST_TAG" ]; then
            publish_args+=(--tag "$NPM_DIST_TAG")
          fi

          npm "${publish_args[@]}"
