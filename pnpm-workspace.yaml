packages:
  - "packages/connector-api"
  - "packages/connector-testkit"
  - "packages/cli"
  - "packages/local-runtime"
  - "packages/workspace/server"
  - "packages/workspace/client"
  - "packages/workspace/conformance"

minimumReleaseAgeExclude:
  - '@sparxie/*'

# Electron Builder's current stable dependency ranges still admit releases
# superseded by security fixes. Keep each override line-compatible with its
# consumer while requiring the first upstream release that fixes all published
# advisories for that line.
overrides:
  'brace-expansion@1.1.16': 1.1.18
  'brace-expansion@2.1.3': 2.1.4
  'brace-expansion@5.0.8': 5.0.9
  'fast-uri@3.1.4': 3.1.5

allowBuilds:
  lefthook: true
  electron: true
  electron-winstaller: true
  esbuild: false
