name: Release Mac

on:
  workflow_dispatch:
    inputs:
      publish_update_feed:
        description: Publish this main-branch build to the alpha update feed
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-mac-alpha
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify Release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    outputs:
      publish_update_feed: ${{ steps.release-mode.outputs.publish_update_feed }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: valedictorian-app

      - name: Resolve release mode
        id: release-mode
        env:
          REQUESTED_PUBLISH: ${{ inputs.publish_update_feed }}
        run: |
          publish_update_feed=false

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            publish_update_feed=true
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${REQUESTED_PUBLISH}" = "true" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::Manual update-feed publishing is restricted to the main branch"
              exit 1
            fi

            publish_update_feed=true
          fi

          echo "publish_update_feed=${publish_update_feed}" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: valedictorian-app
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const expectedTag = `v${packageJson.version}`
          const actualTag = process.env.GITHUB_REF_NAME

          if (actualTag !== expectedTag) {
            throw new Error(`Release tag ${actualTag} does not match package version ${expectedTag}`)
          }
          NODE

      - name: Validate macOS signing secrets
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for secret_name in \
            MAC_CSC_LINK \
            MAC_CSC_KEY_PASSWORD \
            APPLE_API_KEY \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER \
            APPLE_TEAM_ID
          do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name is required for signed and notarized Mac releases"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Validate update feed publishing secrets
        if: steps.release-mode.outputs.publish_update_feed == 'true'
        env:
          UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL }}
          UPDATE_FEED_ENDPOINT: ${{ secrets.UPDATE_FEED_ENDPOINT }}
          UPDATE_FEED_BUCKET: ${{ secrets.UPDATE_FEED_BUCKET }}
          UPDATE_FEED_ACCESS_KEY_ID: ${{ secrets.UPDATE_FEED_ACCESS_KEY_ID }}
          UPDATE_FEED_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_FEED_SECRET_ACCESS_KEY }}
          UPDATE_FEED_PREFIX: ${{ vars.UPDATE_FEED_PREFIX }}
        run: |
          missing=0
          for secret_name in \
            UPDATE_FEED_URL \
            UPDATE_FEED_ENDPOINT \
            UPDATE_FEED_BUCKET \
            UPDATE_FEED_ACCESS_KEY_ID \
            UPDATE_FEED_SECRET_ACCESS_KEY \
            UPDATE_FEED_PREFIX
          do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name is required for publishing app update metadata"
              missing=1
            fi
          done

          if [ "$UPDATE_FEED_URL" != "https://updates.valedictorian.app/mac/alpha" ]; then
            echo "::error::UPDATE_FEED_URL must match the app's electron-builder publish URL"
            missing=1
          fi

          if [ "$UPDATE_FEED_PREFIX" != "mac/alpha" ]; then
            echo "::error::UPDATE_FEED_PREFIX must be mac/alpha"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: valedictorian-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: valedictorian-app
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after $attempt attempts"
              exit 1
            fi

            sleep_seconds=$((attempt * 10))
            echo "pnpm install failed (attempt $attempt), retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Run tests
        working-directory: valedictorian-app
        run: pnpm test

      - name: Lint and typecheck
        working-directory: valedictorian-app
        run: pnpm lint

  build-mac:
    name: Build Mac DMG
    needs: verify
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: valedictorian-app

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.5.0

      - name: Install dependencies
        working-directory: valedictorian-app
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after $attempt attempts"
              exit 1
            fi

            sleep_seconds=$((attempt * 10))
            echo "pnpm install failed (attempt $attempt), retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Decode App Store Connect API key
        working-directory: valedictorian-app
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s' "$APPLE_API_KEY" | base64 --decode > "${{ runner.temp }}/app-store-connect-api-key.p8"
          chmod 600 "${{ runner.temp }}/app-store-connect-api-key.p8"

      - name: Build Mac DMG
        working-directory: valedictorian-app
        run: pnpm build:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/app-store-connect-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Inspect assets and verify packaged PGlite restart
        working-directory: valedictorian-app
        run: pnpm run smoke:pglite-package

      - name: Generate update metadata
        working-directory: valedictorian-app
        run: pnpm exec tsx scripts/generate-mac-update-metadata.ts

      - name: Verify update artifacts exist
        working-directory: valedictorian-app
        run: |
          dmg_path="$(find release -type f -name '*.dmg' -print -quit)"
          zip_path="$(find release -type f -name '*.zip' -print -quit)"
          latest_path="$(find release -type f -name 'latest-mac.yml' -print -quit)"
          test -n "$dmg_path"
          test -n "$zip_path"
          test -n "$latest_path"
          echo "Built $dmg_path"
          echo "Built $zip_path"
          echo "Built $latest_path"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: valedictorian-app-mac-dmg
          retention-days: 1
          path: |
            valedictorian-app/release/*/*.dmg
            valedictorian-app/release/*/*.zip
            valedictorian-app/release/*/*.blockmap
            valedictorian-app/release/*/latest-mac.yml
          if-no-files-found: error

      - name: Publish update feed
        if: needs.verify.outputs.publish_update_feed == 'true'
        working-directory: valedictorian-app
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_FEED_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_FEED_SECRET_ACCESS_KEY }}
          UPDATE_FEED_BUCKET: ${{ secrets.UPDATE_FEED_BUCKET }}
          UPDATE_FEED_ENDPOINT: ${{ secrets.UPDATE_FEED_ENDPOINT }}
          UPDATE_FEED_PREFIX: ${{ vars.UPDATE_FEED_PREFIX }}
        run: |
          release_dir="$(find release -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$release_dir"

          feed_destination="s3://${UPDATE_FEED_BUCKET}/${UPDATE_FEED_PREFIX}"
          aws_args=(--endpoint-url "$UPDATE_FEED_ENDPOINT")

          aws s3 sync "$release_dir" "$feed_destination/" \
            "${aws_args[@]}" \
            --exclude "*" \
            --include "*.dmg" \
            --include "*.zip" \
            --include "*.blockmap" \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp "$release_dir/latest-mac.yml" "$feed_destination/latest-mac.yml" \
            "${aws_args[@]}" \
            --cache-control "no-cache" \
            --content-type "text/yaml"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: valedictorian-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*/*.dmg release/*/*.zip release/*/*.blockmap release/*/latest-mac.yml --clobber
          else
            release_args=(
              release create "$GITHUB_REF_NAME" release/*/*.dmg release/*/*.zip release/*/*.blockmap release/*/latest-mac.yml
              --title "Valedictorian $GITHUB_REF_NAME"
              --notes "Signed and notarized Mac build."
            )

            if [[ "$version" == *-* ]]; then
              release_args+=(--prerelease)
            fi

            gh "${release_args[@]}"
          fi
