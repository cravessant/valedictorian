name: Release Mac

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-mac:
    name: Build Mac DMG
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const expectedTag = `v${packageJson.version}`
          const actualTag = process.env.GITHUB_REF_NAME

          if (actualTag !== expectedTag) {
            throw new Error(`Release tag ${actualTag} does not match package version ${expectedTag}`)
          }
          NODE

      - name: Run tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Validate macOS signing secrets
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for secret_name in \
            MAC_CSC_LINK \
            MAC_CSC_KEY_PASSWORD \
            APPLE_API_KEY \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER \
            APPLE_TEAM_ID
          do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name is required for signed and notarized Mac releases"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Validate update feed publishing secrets
        env:
          UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL }}
          UPDATE_FEED_ENDPOINT: ${{ secrets.UPDATE_FEED_ENDPOINT }}
          UPDATE_FEED_BUCKET: ${{ secrets.UPDATE_FEED_BUCKET }}
          UPDATE_FEED_ACCESS_KEY_ID: ${{ secrets.UPDATE_FEED_ACCESS_KEY_ID }}
          UPDATE_FEED_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_FEED_SECRET_ACCESS_KEY }}
          UPDATE_FEED_PREFIX: ${{ vars.UPDATE_FEED_PREFIX }}
        run: |
          missing=0
          for secret_name in \
            UPDATE_FEED_URL \
            UPDATE_FEED_ENDPOINT \
            UPDATE_FEED_BUCKET \
            UPDATE_FEED_ACCESS_KEY_ID \
            UPDATE_FEED_SECRET_ACCESS_KEY \
            UPDATE_FEED_PREFIX
          do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name is required for publishing app update metadata"
              missing=1
            fi
          done

          if [ "$UPDATE_FEED_URL" != "https://updates.valedictorian.app/mac/alpha" ]; then
            echo "::error::UPDATE_FEED_URL must match the app's electron-builder publish URL"
            missing=1
          fi

          if [ "$UPDATE_FEED_PREFIX" != "mac/alpha" ]; then
            echo "::error::UPDATE_FEED_PREFIX must be mac/alpha"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Decode App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s' "$APPLE_API_KEY" | base64 --decode > "${{ runner.temp }}/app-store-connect-api-key.p8"
          chmod 600 "${{ runner.temp }}/app-store-connect-api-key.p8"

      - name: Build Mac DMG
        run: pnpm build:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/app-store-connect-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify update artifacts exist
        run: |
          dmg_path="$(find release -type f -name '*.dmg' -print -quit)"
          zip_path="$(find release -type f -name '*.zip' -print -quit)"
          latest_path="$(find release -type f -name 'latest-mac.yml' -print -quit)"
          test -n "$dmg_path"
          test -n "$zip_path"
          test -n "$latest_path"
          echo "Built $dmg_path"
          echo "Built $zip_path"
          echo "Built $latest_path"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: valedictorian-app-mac-dmg
          path: |
            release/*/*.dmg
            release/*/*.zip
            release/*/*.blockmap
            release/*/latest-mac.yml
          if-no-files-found: error

      - name: Publish update feed
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_FEED_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_FEED_SECRET_ACCESS_KEY }}
          UPDATE_FEED_BUCKET: ${{ secrets.UPDATE_FEED_BUCKET }}
          UPDATE_FEED_ENDPOINT: ${{ secrets.UPDATE_FEED_ENDPOINT }}
          UPDATE_FEED_PREFIX: ${{ vars.UPDATE_FEED_PREFIX }}
        run: |
          release_dir="$(find release -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$release_dir"

          feed_destination="s3://${UPDATE_FEED_BUCKET}/${UPDATE_FEED_PREFIX}"
          aws_args=(--endpoint-url "$UPDATE_FEED_ENDPOINT")

          aws s3 sync "$release_dir" "$feed_destination/" \
            "${aws_args[@]}" \
            --exclude "*" \
            --include "*.dmg" \
            --include "*.zip" \
            --include "*.blockmap" \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp "$release_dir/latest-mac.yml" "$feed_destination/latest-mac.yml" \
            "${aws_args[@]}" \
            --cache-control "no-cache" \
            --content-type "text/yaml"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*/*.dmg release/*/*.zip release/*/*.blockmap release/*/latest-mac.yml --clobber
          else
            release_args=(
              release create "$GITHUB_REF_NAME" release/*/*.dmg release/*/*.zip release/*/*.blockmap release/*/latest-mac.yml
              --title "Valedictorian $GITHUB_REF_NAME"
              --notes "Signed and notarized Mac build."
            )

            if [[ "$version" == *-* ]]; then
              release_args+=(--prerelease)
            fi

            gh "${release_args[@]}"
          fi
