name: Release Mac Alpha

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-mac:
    name: Build Mac DMG
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build Mac DMG
        run: pnpm build:mac

      - name: Verify DMG exists
        run: |
          dmg_path="$(find release -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          echo "Built $dmg_path"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: valedictorian-app-mac-dmg
          path: release/*/*.dmg
          if-no-files-found: error

      - name: Create GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*/*.dmg \
              --title "Valedictorian $GITHUB_REF_NAME" \
              --notes "Unsigned private Mac alpha build." \
              --prerelease
          fi
