name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test App
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: valedictorian-app

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: valedictorian-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: valedictorian-app
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after $attempt attempts"
              exit 1
            fi

            sleep_seconds=$((attempt * 10))
            echo "pnpm install failed (attempt $attempt), retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Run tests
        working-directory: valedictorian-app
        run: pnpm test

      - name: Lint
        working-directory: valedictorian-app
        run: pnpm lint

  package-smoke:
    name: Package Smoke (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            package_command: pnpm exec electron-builder --mac --dir --publish never -c.mac.identity=null -c.mac.notarize=false
          - name: Windows
            os: windows-latest
            package_command: pnpm exec electron-builder --win --publish never
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: valedictorian-app

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: valedictorian-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: valedictorian-app
        run: pnpm install --frozen-lockfile

      - name: Build application bundles
        working-directory: valedictorian-app
        run: pnpm exec vite build

      - name: Build packaged application
        working-directory: valedictorian-app
        run: ${{ matrix.package_command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify Windows installer
        if: runner.os == 'Windows'
        working-directory: valedictorian-app
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Recurse -Filter 'Valedictorian-Windows-*-Setup.exe')
          if ($installers.Count -ne 1) {
            throw "Expected one configured NSIS installer; found $($installers.Count)"
          }

      - name: Inspect assets and verify PGlite restart
        working-directory: valedictorian-app
        run: pnpm run smoke:pglite-package
