name: CI

on:
  pull_request:
    types:
      - converted_to_draft
      - opened
      - ready_for_review
      - reopened
      - synchronize
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Draft Quality
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: valedictorian-app

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: valedictorian-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: valedictorian-app
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: valedictorian-app
        run: pnpm lint

  test:
    name: Test App (shard ${{ matrix.shard }}/2)
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: valedictorian-app

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: valedictorian-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: valedictorian-app
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after $attempt attempts"
              exit 1
            fi

            sleep_seconds=$((attempt * 10))
            echo "pnpm install failed (attempt $attempt), retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Restore Vitest transform and V8 compile caches
        uses: actions/cache@v4
        with:
          path: |
            valedictorian-app/node_modules/.vite
            valedictorian-app/.node-compile-cache
          key: vitest-cache-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('valedictorian-app/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vitest-cache-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('valedictorian-app/pnpm-lock.yaml') }}-
            vitest-cache-${{ runner.os }}-shard${{ matrix.shard }}-

      - name: Run tests
        working-directory: valedictorian-app
        shell: bash
        run: |
          TEST_TEMP_ROOT="$(node scripts/allocate-test-temp.mjs --print-root)"
          [ -n "$TEST_TEMP_ROOT" ] || exit 1
          cleanup_test_temp() {
            local status=$?
            trap - EXIT INT TERM
            if node scripts/allocate-test-temp.mjs --cleanup "$TEST_TEMP_ROOT"; then
              :
            else
              local cleanup_status=$?
              if [ "$status" -eq 0 ]; then
                status=$cleanup_status
              fi
            fi
            exit "$status"
          }
          on_int() { exit 130; }
          on_term() { exit 143; }
          trap cleanup_test_temp EXIT
          trap on_int INT
          trap on_term TERM
          TMPDIR="$TEST_TEMP_ROOT" pnpm exec vitest run --shard=${{ matrix.shard }}/2 --minWorkers=2 --maxWorkers=2
        env:
          NODE_OPTIONS: --disable-warning=DEP0176 --disable-warning=DEP0205
          NODE_COMPILE_CACHE: ${{ github.workspace }}/valedictorian-app/.node-compile-cache
          VALEDICTORIAN_WINDOW_TESTS: "1"

  dev-proof:
    name: CLI/UI Development Proof
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: valedictorian-app

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: valedictorian-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: valedictorian-app
        run: pnpm install --frozen-lockfile

      - name: Verify virtual display support
        run: command -v xvfb-run

      - name: Prove CLI and Electron UI parity
        working-directory: valedictorian-app
        run: pnpm run proof:dev

      # Geometry proofs measure the merged result. Branch-level checks cannot
      # catch a validation-copy change and a proof run landing from branches
      # that never saw each other.
      - name: Prove Capture completion dialog layout
        working-directory: valedictorian-app
        run: pnpm run smoke:capture-completion-dialog-layout

      - name: Prove shared dialog close target
        working-directory: valedictorian-app
        run: pnpm run smoke:dialog-close-target

  package-smoke:
    name: Package Smoke (${{ matrix.name }})
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: blacksmith-6vcpu-macos-latest
            package_command: pnpm exec electron-builder --mac --dir --publish never -c.mac.identity=null -c.mac.notarize=false
          - name: Windows
            runner: blacksmith-2vcpu-windows-2025
            package_command: pnpm exec electron-builder --win --publish never
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: valedictorian-app

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: valedictorian-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: valedictorian-app
        run: pnpm install --frozen-lockfile

      - name: Inspect Electron runtime
        working-directory: valedictorian-app
        run: pnpm run inspect:electron-runtime

      - name: Run macOS package checks
        if: runner.os == 'macOS'
        timeout-minutes: 5
        working-directory: valedictorian-app
        shell: bash
        run: |
          pnpm lint
          pnpm exec vite build
          CSC_IDENTITY_AUTO_DISCOVERY=false ${{ matrix.package_command }}
          pnpm run smoke:pglite-package
          pnpm run smoke:connector-modal-scroll

      - name: Build Windows application bundles
        if: runner.os == 'Windows'
        working-directory: valedictorian-app
        run: pnpm exec vite build

      - name: Build Windows packaged application
        if: runner.os == 'Windows'
        working-directory: valedictorian-app
        run: ${{ matrix.package_command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify Windows installer
        if: runner.os == 'Windows'
        working-directory: valedictorian-app
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Recurse -Filter 'Valedictorian-Windows-*-Setup.exe')
          if ($installers.Count -ne 1) {
            throw "Expected one configured NSIS installer; found $($installers.Count)"
          }

      - name: Inspect Windows assets and verify PGlite restart
        if: runner.os == 'Windows'
        working-directory: valedictorian-app
        run: pnpm run smoke:pglite-package

  ci:
    name: CI
    if: always()
    needs:
      - dev-proof
      - package-smoke
      - quality
      - test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          DEV_PROOF_RESULT: ${{ needs.dev-proof.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$IS_DRAFT" = "true" ]; then
            if [ "$QUALITY_RESULT" != "success" ] || \
               [ "$DEV_PROOF_RESULT" != "skipped" ] || \
               [ "$TEST_RESULT" != "skipped" ] || \
               [ "$PACKAGE_SMOKE_RESULT" != "skipped" ]; then
              echo "::error::Draft quality finished with $QUALITY_RESULT; development proof finished with $DEV_PROOF_RESULT; tests finished with $TEST_RESULT; package smoke finished with $PACKAGE_SMOKE_RESULT"
              exit 1
            fi
          elif [ "$QUALITY_RESULT" != "skipped" ] || \
               [ "$DEV_PROOF_RESULT" != "success" ] || \
               [ "$TEST_RESULT" != "success" ] || \
               [ "$PACKAGE_SMOKE_RESULT" != "success" ]; then
            echo "::error::Ready quality finished with $QUALITY_RESULT; development proof finished with $DEV_PROOF_RESULT; tests finished with $TEST_RESULT; package smoke finished with $PACKAGE_SMOKE_RESULT"
            exit 1
          fi
