name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test App
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: valedictorian-app

      - name: Validate connector repo access token
        env:
          CONNECTORS_REPO_TOKEN: ${{ secrets.CONNECTORS_REPO_TOKEN }}
        run: |
          if [ -z "$CONNECTORS_REPO_TOKEN" ]; then
            echo "::error::CONNECTORS_REPO_TOKEN is required to check out KennyKeni/valedictorian-connectors"
            exit 1
          fi

      - name: Check out connector packages
        uses: actions/checkout@v6
        with:
          repository: KennyKeni/valedictorian-connectors
          path: valedictorian-connectors
          token: ${{ secrets.CONNECTORS_REPO_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: valedictorian-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: valedictorian-app
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: valedictorian-app
        run: pnpm test

      - name: Typecheck
        working-directory: valedictorian-app
        run: pnpm typecheck

      - name: Lint
        working-directory: valedictorian-app
        run: pnpm lint
