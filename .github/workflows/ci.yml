name: CI

on:
  pull_request:
    types:
      - converted_to_draft
      - opened
      - ready_for_review
      - reopened
      - synchronize
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: valedictorian-app

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: valedictorian-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: valedictorian-app
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after $attempt attempts"
              exit 1
            fi

            sleep_seconds=$((attempt * 10))
            echo "pnpm install failed (attempt $attempt), retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Lint
        working-directory: valedictorian-app
        run: pnpm lint

  node-tests:
    name: Node Tests (${{ matrix.shard }}/2)
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: valedictorian-app

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: valedictorian-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: valedictorian-app
        run: pnpm install --frozen-lockfile

      - name: Run test shard
        working-directory: valedictorian-app
        run: pnpm test --shard=${{ matrix.shard }}/2

  package-smoke:
    name: Package Smoke (${{ matrix.name }})
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            package_command: pnpm exec electron-builder --mac --dir --publish never -c.mac.identity=null -c.mac.notarize=false
          - name: Windows
            os: windows-latest
            package_command: pnpm exec electron-builder --win --publish never
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: valedictorian-app

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: valedictorian-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: valedictorian-app
        run: pnpm install --frozen-lockfile

      - name: Build application bundles
        working-directory: valedictorian-app
        run: pnpm exec vite build

      - name: Build packaged application
        working-directory: valedictorian-app
        run: ${{ matrix.package_command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify Windows installer
        if: runner.os == 'Windows'
        working-directory: valedictorian-app
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Recurse -Filter 'Valedictorian-Windows-*-Setup.exe')
          if ($installers.Count -ne 1) {
            throw "Expected one configured NSIS installer; found $($installers.Count)"
          }

      - name: Inspect assets and verify PGlite restart
        working-directory: valedictorian-app
        run: pnpm run smoke:pglite-package

  ci:
    name: CI
    if: always()
    needs:
      - node-tests
      - package-smoke
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          NODE_TESTS_RESULT: ${{ needs.node-tests.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ]; then
            echo "::error::Quality job finished with $QUALITY_RESULT"
            exit 1
          fi

          if [ "$IS_DRAFT" = "true" ]; then
            expected_expensive_result=skipped
          else
            expected_expensive_result=success
          fi

          if [ "$NODE_TESTS_RESULT" != "$expected_expensive_result" ] || \
             [ "$PACKAGE_SMOKE_RESULT" != "$expected_expensive_result" ]; then
            echo "::error::Node tests finished with $NODE_TESTS_RESULT; package smoke finished with $PACKAGE_SMOKE_RESULT"
            exit 1
          fi
